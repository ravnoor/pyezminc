name: Build and Upload Conda Package for pyezminc

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main

# trusted publishing permissions
permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build package
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target-platform: linux-64
            build-args: --target-platform linux-64
          - os: ubuntu-24.04-arm
            target-platform: linux-aarch64
            build-args: --target-platform linux-aarch64 # --test skip
          - os: macos-latest
            target-platform: osx-arm64
            build-args: --target-platform osx-arm64

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Authenticate with private channel on repo.prefix.dev
        run: |
          echo '{"repo.prefix.dev": {"CondaToken": "${{ secrets.PREFIX_API_KEY }}"}}' > ${{ runner.temp }}/credentials.json
          echo "RATTLER_AUTH_FILE=${{ runner.temp }}/credentials.json" >> $GITHUB_ENV

      - name: Build conda package
        uses: prefix-dev/rattler-build-action@v0.2.33
        with:
          # needs to be unique for each matrix entry
          artifact-name: pyezminc-${{ matrix.target-platform }}
          build-args: ${{ matrix.build-args }} --experimental --package-format conda:22 --channel conda-forge --channel https://repo.prefix.dev/nrx-forge --output-dir /tmp/rattler-pyezminc-${{ matrix.target-platform }}/
          recipe-path: conda/recipe.yaml

      - name: Upload package
        shell: bash
        # do not upload on PR
        if: github.event_name == 'push'
        run: |
          for pkg in $(find /tmp/rattler-pyezminc-${{ matrix.target-platform }}/ -type f \( -name "*.conda" -o -name "*.tar.bz2" \) ); do
            echo "Uploading ${pkg}"
            rattler-build upload prefix -c nrx-forge "${pkg}"
          done
